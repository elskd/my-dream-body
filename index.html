<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d9b9cf">
<title>My Dream Body</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="app"></div>
<script>
window.addEventListener("error",function(e){
  var a=document.getElementById("app");
  if(a&&(!a.innerHTML||a.innerHTML.trim()==="")){
    a.innerHTML='<div style="padding:40px;font-family:system-ui;text-align:center"><h2>My Dream Body</h2><p>Ошибка запуска приложения.</p><p style="color:#777">Обнови страницу ещё раз.</p></div>';
  }
});
window.addEventListener("unhandledrejection",function(){
  var a=document.getElementById("app");
  if(a&&(!a.innerHTML||a.innerHTML.trim()==="")){
    a.innerHTML='<div style="padding:40px;font-family:system-ui;text-align:center"><h2>My Dream Body</h2><p>Ошибка запуска приложения.</p></div>';
  }
});
</script>
<script src="app.js?v=7"></script>
</body>
</html>
